name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  native-android:
    name: Build native artseek (Android arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android build-tools (d8) & NDK
        id: android-env
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          D8="$(ls -1 "$SDK"/build-tools/*/d8 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$D8" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null
            D8="$SDK/build-tools/35.0.0/d8"
          fi
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -1d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
            NDK="$SDK/ndk/27.2.12479018"
          fi
          echo "d8=$D8" >> "$GITHUB_OUTPUT"
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using d8:  $D8"
          echo "Using NDK: $NDK"

      - name: Compile assets/sentinel.dex
        shell: bash
        env:
          D8_BIN: ${{ steps.android-env.outputs.d8 }}
        run: |
          chmod +x sentinel/build.sh
          ./sentinel/build.sh
          test -s assets/sentinel.dex

      - name: Set up xmake (>= 3.0.6)
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.8'

      - name: Verify xmake version
        shell: bash
        run: xmake --version

      - name: Build artseek (android arm64-v8a release)
        shell: bash
        env:
          NDK_HOME: ${{ steps.android-env.outputs.ndk }}
        run: |
          set -euo pipefail
          xmake f -p android -a arm64-v8a -m release --ndk="$NDK_HOME" --ndk_sdkver=29 -y
          xmake -v

      - name: Verify utils.bin2obj embedded sentinel & ELF binary
        shell: bash
        env:
          NDK_HOME: ${{ steps.android-env.outputs.ndk }}
        run: |
          set -euo pipefail
          LLVM_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OBJ="build/.objs/artseek/android/arm64-v8a/release/assets/sentinel.dex.o"
          BIN="build/android/arm64-v8a/release/artseek"
          test -f "$OBJ"
          test -x "$BIN"
          "$LLVM_BIN/llvm-nm" "$OBJ" | grep -q "_binary_sentinel_dex_start"
          "$LLVM_BIN/llvm-nm" "$OBJ" | grep -q "_binary_sentinel_dex_end"
          "$LLVM_BIN/llvm-readelf" -h "$BIN" | grep -q "AArch64"
          "$LLVM_BIN/llvm-readelf" -d "$BIN" | grep NEEDED
          ls -lh "$BIN"

      - name: Upload artseek arm64-v8a binary
        uses: actions/upload-artifact@v4
        with:
          name: artseek-android-arm64-v8a
          path: build/android/arm64-v8a/release/artseek
          if-no-files-found: error

  sdk:
    name: Build & test TypeScript SDK (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, build, and test SDK
        working-directory: sdk
        shell: bash
        run: |
          npm ci
          npm run build
          npm test
